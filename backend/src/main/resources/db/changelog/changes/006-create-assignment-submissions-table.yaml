databaseChangeLog:
  - changeSet:
      id: 006-create-assignment-submissions-table
      author: imilearn
      changes:
        - createTable:
            tableName: assignment_submissions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: assignment_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_assignment_submissions_assignment
                    references: assignments(id)
              - column:
                  name: student_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_assignment_submissions_student
                    references: users(id)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITH TIME ZONE
        - addUniqueConstraint:
            tableName: assignment_submissions
            columnNames: assignment_id, student_id
            constraintName: uq_assignment_submissions_assignment_student
