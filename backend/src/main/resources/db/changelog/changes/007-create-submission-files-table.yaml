databaseChangeLog:
  - changeSet:
      id: 007-create-submission-files-table
      author: imilearn
      changes:
        - createTable:
            tableName: submission_files
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: submission_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_submission_files_submission
                    references: assignment_submissions(id)
              - column:
                  name: file_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: storage_key
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_submission_files_storage_key
              - column:
                  name: content_type
                  type: VARCHAR(255)
              - column:
                  name: size_bytes
                  type: BIGINT
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITH TIME ZONE
