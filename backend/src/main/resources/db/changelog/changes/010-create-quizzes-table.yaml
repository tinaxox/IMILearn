databaseChangeLog:
  - changeSet:
      id: 010-create-quizzes-table
      author: imilearn
      changes:
        - createTable:
            tableName: quizzes
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: subject_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_quizzes_subject
                    references: subjects(id)
              - column:
                  name: created_by_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_quizzes_created_by
                    references: users(id)
              - column:
                  name: questions
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: answers
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITH TIME ZONE
