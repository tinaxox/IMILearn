databaseChangeLog:
  - changeSet:
      id: 011-create-quiz-submissions-table
      author: imilearn
      changes:
        - createTable:
            tableName: quiz_submissions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: quiz_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_quiz_submissions_quiz
                    references: quizzes(id)
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_quiz_submissions_user
                    references: users(id)
              - column:
                  name: submitted_answers
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: score
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: correct_count
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: total_questions
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: result
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITH TIME ZONE
