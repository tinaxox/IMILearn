databaseChangeLog:
  - changeSet:
      id: 013-create-quiz-question-generation-requests-table
      author: imilearn
      changes:
        - createTable:
            tableName: quiz_question_generation_requests
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: material_ids
                  type: BIGINT[]
                  constraints:
                    nullable: false
              - column:
                  name: subject_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_quiz_question_generation_requests_subject
                    references: subjects(id)
              - column:
                  name: requested_by_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_quiz_question_generation_requests_requested_by
                    references: users(id)
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: requested_question_count
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: result_quiz_id
                  type: BIGINT
              - column:
                  name: error_message
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITH TIME ZONE
