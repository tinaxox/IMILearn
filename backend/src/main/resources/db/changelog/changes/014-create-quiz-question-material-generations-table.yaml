databaseChangeLog:
  - changeSet:
      id: 014-create-quiz-question-material-generations-table
      author: imilearn
      changes:
        - createTable:
            tableName: quiz_question_material_generations
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: material_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_quiz_question_material_generations_material
                    foreignKeyName: fk_quiz_question_material_generations_material
                    references: materials(id)
              - column:
                  name: questions
                  type: JSONB
              - column:
                  name: answers
                  type: JSONB
              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: retry_count
                  type: INTEGER
                  defaultValueNumeric: "0"
                  constraints:
                    nullable: false
              - column:
                  name: error_message
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITH TIME ZONE
