databaseChangeLog:
  - changeSet:
      id: 015-create-exam-grades-table
      author: imilearn
      changes:
        - createTable:
            tableName: exam_grades
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: exam_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_exam_grades_exam
                    references: exams(id)
              - column:
                  name: student_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_exam_grades_student
                    references: users(id)
              - column:
                  name: points
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITH TIME ZONE
        - addUniqueConstraint:
            tableName: exam_grades
            columnNames: exam_id, student_id
            constraintName: uq_exam_grades_exam_student
