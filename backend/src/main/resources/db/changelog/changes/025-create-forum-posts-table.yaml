databaseChangeLog:
  - changeSet:
      id: 025-create-forum-posts-table
      author: imilearn
      changes:
        - createTable:
            tableName: forum_posts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: body
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: thread_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_forum_posts_thread
                    references: forum_threads(id)
              - column:
                  name: author_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_forum_posts_author
                    references: users(id)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITH TIME ZONE
